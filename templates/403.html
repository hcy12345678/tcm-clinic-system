{% extends 'base.html' %}

{% block title %}无权访问{% endblock %}

{% block content %}
<div class="card error-card">
    <div class="card-body text-center">
        <div class="error-code">403</div>
        <h1 class="h4">抱歉，您没有权限访问此页面</h1>
        <p class="text-secondary">如需使用此功能，请联系系统管理员调整角色权限。</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'dashboard' %}" class="btn btn-primary">返回工作台</a>
            <button type="button" class="btn btn-outline-secondary" data-action="back" data-fallback="{% url 'dashboard' %}">返回上一页</button>
        </div>
    </div>
</div>
{% endblock %}

{% block auth_content %}
<div class="card error-card auth-card">
    <div class="card-body text-center">
        <div class="error-code">403</div>
        <h1 class="h4">抱歉，您没有权限访问此页面</h1>
        <p class="text-secondary">请先登录具有相应权限的账号。</p>
        <a href="{% url 'login' %}" class="btn btn-primary">前往登录</a>
    </div>
</div>
{% endblock %}
