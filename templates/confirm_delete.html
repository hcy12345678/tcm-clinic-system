{% extends 'base.html' %}

{% block title %}{{ title|default:"确认删除" }}{% endblock %}

{% block content %}
<div class="page-header"><div><h1>{{ title|default:"确认删除" }}</h1></div></div>
<div class="card confirm-card">
    <div class="card-body text-center">
        <span class="warning-icon"><i class="bi bi-exclamation-triangle"></i></span>
        <h2 class="h5">确定要删除这条记录吗？</h2>
        <p class="text-secondary">删除对象：<strong>{{ object }}</strong></p>
        <div class="alert alert-warning mb-4">删除后无法恢复，请确认相关信息无误。</div>
        <form method="post" class="d-flex justify-content-center gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>确认删除</button>
            {% if cancel_url %}
            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">取消</a>
            {% else %}
            <button type="button" class="btn btn-outline-secondary" data-action="back" data-fallback="{% url 'dashboard' %}">取消</button>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
