<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排班登记 · 中医门诊预约系统</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="schedules">
  <header class="topbar" id="layout-topbar"></header>
  <div class="layout-body">
    <aside class="sidebar" id="layout-sidebar"></aside>
    <main class="layout-main">
      <div class="page-head">
        <div>
          <h1 id="page-title">新增排班</h1>
          <div class="sub">同一医师同一天的开始时间不能重复；已有预约的排班不能删除，只能暂停</div>
        </div>
        <div class="actions">
          <a class="btn btn-light" href="schedules.html"><i class="bi bi-arrow-left"></i> 返回列表</a>
        </div>
      </div>

      <div class="card">
        <form id="schedule-form" class="form-grid" novalidate>
          <div class="field" id="doctor-field">
            <label for="doctor">出诊医师</label>
            <select id="doctor" name="doctor"></select>
          </div>
          <div class="field">
            <label for="date">出诊日期</label>
            <input type="date" id="date" name="date" required>
          </div>
          <div class="field">
            <label for="start_time">开始时间</label>
            <input type="time" id="start_time" name="start_time" required>
          </div>
          <div class="field">
            <label for="end_time">结束时间</label>
            <input type="time" id="end_time" name="end_time" required>
          </div>
          <div class="field">
            <label for="room">诊室</label>
            <input type="text" id="room" name="room" placeholder="如 一楼 101 诊室">
          </div>
          <div class="field">
            <label for="total_slots">号源数量</label>
            <input type="number" id="total_slots" name="total_slots" min="1" value="20" required>
          </div>
          <div class="field">
            <label for="status">排班状态</label>
            <select id="status" name="status">
              <option value="OPEN">开放预约</option>
              <option value="STOPPED">暂停预约</option>
            </select>
          </div>
          <div class="full form-actions">
            <button type="submit" class="btn btn-primary" id="save-btn"><i class="bi bi-save"></i> 保存排班</button>
            <a class="btn btn-light" href="schedules.html">取消</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (async function () {
      const me = await Layout.mount('schedules');
      if (!me) return;

      const id = UI.qs('id');
      const form = document.getElementById('schedule-form');
      const saveBtn = document.getElementById('save-btn');
      const doctorField = document.getElementById('doctor-field');
      const doctorSelect = document.getElementById('doctor');

      // 医师账号只能给自己排班，隐藏医师选择框，由接口按登录人补全
      if (me.user.role === 'DOCTOR') {
        doctorField.style.display = 'none';
      } else {
        try {
          const doctors = await API.get('/doctors/');
          doctorSelect.innerHTML = doctors.map((item) =>
            `<option value="${item.id}">${UI.escapeHtml(item.name)}｜${UI.escapeHtml(item.department)}｜${UI.escapeHtml(item.title)}</option>`
          ).join('');
        } catch (error) {
          UI.toast(error.message, 'error');
        }
      }

      if (id) {
        document.getElementById('page-title').textContent = '编辑排班';
        try {
          const schedule = await API.get(`/schedules/${id}/`);
          document.getElementById('date').value = schedule.date;
          document.getElementById('start_time').value = schedule.start_time;
          document.getElementById('end_time').value = schedule.end_time;
          document.getElementById('room').value = schedule.room;
          document.getElementById('total_slots').value = schedule.total_slots;
          document.getElementById('status').value = schedule.status;
          if (me.user.role !== 'DOCTOR') doctorSelect.value = String(schedule.doctor_id);
        } catch (error) {
          UI.toast(error.message, 'error');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = UI.formToObject(form);
        if (data.start_time && data.end_time && data.start_time >= data.end_time) {
          UI.toast('结束时间必须晚于开始时间', 'error');
          return;
        }
        UI.setLoading(saveBtn, true, '保存中…');
        try {
          if (id) {
            await API.put(`/schedules/${id}/`, data);
            UI.toast('排班已更新');
          } else {
            await API.post('/schedules/', data);
            UI.toast('排班已创建');
          }
          setTimeout(() => { location.href = 'schedules.html'; }, 500);
        } catch (error) {
          UI.showFieldErrors(error);
          UI.toast(error.message, 'error');
          UI.setLoading(saveBtn, false);
        }
      });
    })();
  </script>
</body>
</html>
