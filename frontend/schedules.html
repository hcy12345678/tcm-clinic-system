<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>医师排班 · 中医门诊预约系统</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="schedules">
  <header class="topbar" id="layout-topbar"></header>
  <div class="layout-body">
    <aside class="sidebar" id="layout-sidebar"></aside>
    <main class="layout-main">
      <div class="page-head">
        <div>
          <h1>医师排班</h1>
          <div class="sub">编排出诊时间与号源，支持多条件筛选</div>
        </div>
        <div class="actions">
          <a class="btn btn-primary" href="schedule-form.html"><i class="bi bi-plus-lg"></i> 新增排班</a>
        </div>
      </div>

      <div class="card">
        <form class="filter-bar" id="filter-form">
          <div class="field">
            <label>关键词</label>
            <input type="text" name="keyword" placeholder="医师 / 科室 / 诊室">
          </div>
          <div class="field">
            <label>医师</label>
            <select name="doctor" id="doctor-filter"><option value="">全部医师</option></select>
          </div>
          <div class="field">
            <label>状态</label>
            <select name="status">
              <option value="">全部状态</option>
              <option value="OPEN">开放预约</option>
              <option value="STOPPED">暂停预约</option>
            </select>
          </div>
          <div class="field">
            <label>开始日期</label>
            <input type="date" name="start_date">
          </div>
          <div class="field">
            <label>结束日期</label>
            <input type="date" name="end_date">
          </div>
          <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> 查询</button>
          <button type="reset" class="btn btn-light">重置</button>
        </form>
      </div>

      <div class="card">
        <div id="schedule-table"></div>
        <div class="pagination" id="schedule-pagination"></div>
      </div>
    </main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (async function () {
      const me = await Layout.mount('schedules');
      if (!me) return;

      const state = { page: 1, params: {} };
      const filterForm = document.getElementById('filter-form');

      try {
        const doctors = await API.get('/doctors/');
        document.getElementById('doctor-filter').innerHTML =
          '<option value="">全部医师</option>' +
          doctors.map((item) => `<option value="${item.id}">${UI.escapeHtml(item.name)}（${UI.escapeHtml(item.department)}）</option>`).join('');
      } catch (error) {
        /* 无医师档案时忽略 */
      }

      function columns() {
        return [
          { title: '出诊日期', render: (row) => UI.escapeHtml(row.date) },
          { title: '时间', render: (row) => `${UI.escapeHtml(row.start_time)} - ${UI.escapeHtml(row.end_time)}` },
          { title: '医师', render: (row) => `${UI.escapeHtml(row.doctor_name)}<div class="hint">${UI.escapeHtml(row.employee_no)}</div>` },
          { title: '科室', render: (row) => UI.escapeHtml(row.department) },
          { title: '诊室', render: (row) => UI.escapeHtml(row.room) },
          { title: '号源', render: (row) => `${row.remaining_slots} / ${row.total_slots}` },
          { title: '状态', render: (row) => UI.badge(row.status, row.status_display) },
          {
            title: '操作',
            render: (row) => `<div class="actions-cell">
              <a class="link-btn" href="schedule-detail.html?id=${row.id}">详情</a>
              <a class="link-btn" href="schedule-form.html?id=${row.id}">编辑</a>
              <button class="link-btn danger" data-del="${row.id}">删除</button>
            </div>`,
          },
        ];
      }

      async function load(page) {
        state.page = page || 1;
        try {
          const data = await API.get('/schedules/', Object.assign({ page: state.page }, state.params));
          document.getElementById('schedule-table').innerHTML = UI.table(columns(), data.results, { empty: '没有符合条件的排班。' });
          UI.pagination(document.getElementById('schedule-pagination'), data, load);
          UI.$$('[data-del]').forEach((button) => {
            button.addEventListener('click', () => remove(button.dataset.del));
          });
        } catch (error) {
          UI.toast(error.message, 'error');
        }
      }

      async function remove(id) {
        const confirmed = await UI.confirm('删除后不可恢复，确定删除该排班吗？', { title: '删除排班', okText: '删除', danger: true });
        if (!confirmed) return;
        try {
          await API.del(`/schedules/${id}/`);
          UI.toast('排班已删除');
          load(state.page);
        } catch (error) {
          UI.toast(error.message, 'error');
        }
      }

      filterForm.addEventListener('submit', (event) => {
        event.preventDefault();
        state.params = UI.formToObject(filterForm);
        load(1);
      });

      filterForm.addEventListener('reset', () => {
        state.params = {};
        setTimeout(() => load(1), 0);
      });

      load(1);
    })();
  </script>
</body>
</html>
